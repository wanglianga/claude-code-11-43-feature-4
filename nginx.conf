server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 样例数据不做强缓存，便于演示数据版本变化
    location /sample-data/ {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
